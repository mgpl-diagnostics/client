name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: mgpl-diagnostics/.github/actions/node@main
        with:
          github-packages: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run build
      - name: llms-full.txt is up to date (run `npm run llms` and commit if this fails)
        run: npm run llms && git diff --exit-code -- llms-full.txt
